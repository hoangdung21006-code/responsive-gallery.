<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>Responsive Image Gallery</h1>
    <p class="intro">Resize the browser window to see the effect.</p>

    <div class="gallery">
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=900&q=80" alt="Ngôi làng ven biển đầy màu sắc">
        <div class="caption">Coastal Village</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=900&q=80" alt="Rừng cây xanh">
        <div class="caption">Green Forest</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Phong cảnh thiên nhiên">
        <div class="caption">Nature</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Núi và hồ">
        <div class="caption">Mountain View</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Hồ nước giữa núi">
        <div class="caption">Quiet Lake</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Thung lũng xanh">
        <div class="caption">Green Valley</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80" alt="Động vật trong thiên nhiên">
        <div class="caption">Wildlife</div>
      </div>
      <div class="gallery-item">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Dãy núi hùng vĩ">
        <div class="caption">High Mountains</div>
      </div>
    </div>
  </main>
</body>
</html>
